<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Guest Intake Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .form-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .input-field {
            border-color: #e2e8f0;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }
        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .submit-btn:active {
            transform: translateY(0);
        }
        .message-box {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateX(400px);
            transition: all 0.3s ease;
        }
        .message-box.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }
        .message-box.success {
            background-color: #10b981;
            color: white;
        }
        .message-box.error {
            background-color: #ef4444;
            color: white;
        }
        .required-asterisk {
            color: #ef4444;
        }
        .section-header {
            border-left: 4px solid #667eea;
            padding-left: 1rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body class="antialiased">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="form-container p-8 md:p-12">
            <div class="text-center mb-10">
                <h1 class="text-4xl md:text-5xl font-bold text-gray-800 mb-3">Podcast Guest Intake Form</h1>
                <p class="text-lg text-gray-600">We're excited to learn more about you! Please fill out the form below.</p>
                <p class="text-sm text-gray-500 mt-2"><span class="required-asterisk">*</span> Required fields</p>
            </div>

            <form id="intake-form" class="space-y-8">
                <!-- Personal Information Section -->
                <div>
                    <div class="section-header">
                        <h2 class="text-2xl font-semibold text-gray-800">Personal Information</h2>
                    </div>

                    <div class="space-y-5">
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
                                Full Name <span class="required-asterisk">*</span>
                            </label>
                            <input type="text" id="name" name="name" required
                                   class="input-field w-full p-3 border rounded-lg"
                                   placeholder="John Doe">
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                                    Email Address <span class="required-asterisk">*</span>
                                </label>
                                <input type="email" id="email" name="email" required
                                       class="input-field w-full p-3 border rounded-lg"
                                       placeholder="john@example.com">
                            </div>

                            <div>
                                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">
                                    Phone Number
                                </label>
                                <input type="tel" id="phone" name="phone"
                                       class="input-field w-full p-3 border rounded-lg"
                                       placeholder="+1 (555) 123-4567">
                            </div>
                        </div>

                        <div>
                            <label for="website" class="block text-sm font-medium text-gray-700 mb-1">
                                Website / Portfolio
                            </label>
                            <input type="url" id="website" name="website"
                                   class="input-field w-full p-3 border rounded-lg"
                                   placeholder="https://yourwebsite.com">
                        </div>
                    </div>
                </div>

                <!-- Social Media Section -->
                <div>
                    <div class="section-header">
                        <h2 class="text-2xl font-semibold text-gray-800">Social Media</h2>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                        <div>
                            <label for="twitter" class="block text-sm font-medium text-gray-700 mb-1">
                                Twitter / X Handle
                            </label>
                            <input type="text" id="twitter" name="twitter"
                                   class="input-field w-full p-3 border rounded-lg"
                                   placeholder="@yourusername">
                        </div>

                        <div>
                            <label for="linkedin" class="block text-sm font-medium text-gray-700 mb-1">
                                LinkedIn Profile
                            </label>
                            <input type="text" id="linkedin" name="linkedin"
                                   class="input-field w-full p-3 border rounded-lg"
                                   placeholder="linkedin.com/in/yourname">
                        </div>

                        <div>
                            <label for="instagram" class="block text-sm font-medium text-gray-700 mb-1">
                                Instagram Handle
                            </label>
                            <input type="text" id="instagram" name="instagram"
                                   class="input-field w-full p-3 border rounded-lg"
                                   placeholder="@yourusername">
                        </div>
                    </div>
                </div>

                <!-- Professional Information Section -->
                <div>
                    <div class="section-header">
                        <h2 class="text-2xl font-semibold text-gray-800">Professional Information</h2>
                    </div>

                    <div class="space-y-5">
                        <div>
                            <label for="expertise" class="block text-sm font-medium text-gray-700 mb-1">
                                Area of Expertise <span class="required-asterisk">*</span>
                            </label>
                            <input type="text" id="expertise" name="expertise" required
                                   class="input-field w-full p-3 border rounded-lg"
                                   placeholder="e.g., Digital Marketing, AI, Entrepreneurship">
                        </div>

                        <div>
                            <label for="topics" class="block text-sm font-medium text-gray-700 mb-1">
                                Potential Discussion Topics
                            </label>
                            <textarea id="topics" name="topics" rows="3"
                                      class="input-field w-full p-3 border rounded-lg"
                                      placeholder="What topics would you like to discuss on the podcast?"></textarea>
                        </div>

                        <div>
                            <label for="bio" class="block text-sm font-medium text-gray-700 mb-1">
                                Brief Bio / Background
                            </label>
                            <textarea id="bio" name="bio" rows="4"
                                      class="input-field w-full p-3 border rounded-lg"
                                      placeholder="Tell us a bit about yourself and your background..."></textarea>
                        </div>

                        <div>
                            <label for="previous_appearances" class="block text-sm font-medium text-gray-700 mb-1">
                                Previous Podcast/Media Appearances
                            </label>
                            <textarea id="previous_appearances" name="previous_appearances" rows="3"
                                      class="input-field w-full p-3 border rounded-lg"
                                      placeholder="List any previous podcast or media appearances with links if available..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Availability & Preferences Section -->
                <div>
                    <div class="section-header">
                        <h2 class="text-2xl font-semibold text-gray-800">Availability & Preferences</h2>
                    </div>

                    <div class="space-y-5">
                        <div>
                            <label for="availability" class="block text-sm font-medium text-gray-700 mb-1">
                                General Availability
                            </label>
                            <textarea id="availability" name="availability" rows="2"
                                      class="input-field w-full p-3 border rounded-lg"
                                      placeholder="e.g., Weekday mornings, Tuesday afternoons, etc."></textarea>
                        </div>

                        <div>
                            <label for="preferred_format" class="block text-sm font-medium text-gray-700 mb-1">
                                Preferred Format
                            </label>
                            <select id="preferred_format" name="preferred_format"
                                    class="input-field w-full p-3 border rounded-lg">
                                <option value="">Select a format...</option>
                                <option value="video">Video (Zoom, etc.)</option>
                                <option value="audio">Audio Only</option>
                                <option value="in-person">In-Person</option>
                                <option value="no-preference">No Preference</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Additional Information Section -->
                <div>
                    <div class="section-header">
                        <h2 class="text-2xl font-semibold text-gray-800">Additional Information</h2>
                    </div>

                    <div class="space-y-5">
                        <div>
                            <label for="additional_notes" class="block text-sm font-medium text-gray-700 mb-1">
                                Additional Notes / Comments
                            </label>
                            <textarea id="additional_notes" name="additional_notes" rows="3"
                                      class="input-field w-full p-3 border rounded-lg"
                                      placeholder="Any additional information you'd like to share..."></textarea>
                        </div>

                        <div>
                            <label for="heard_about" class="block text-sm font-medium text-gray-700 mb-1">
                                How did you hear about us?
                            </label>
                            <input type="text" id="heard_about" name="heard_about"
                                   class="input-field w-full p-3 border rounded-lg"
                                   placeholder="e.g., Social media, referral, website">
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-6">
                    <button type="submit" id="submit-btn"
                            class="submit-btn w-full text-white py-4 rounded-lg font-semibold text-lg">
                        Submit Application
                    </button>
                </div>
            </form>

            <div class="mt-8 text-center">
                <a href="/admin" class="text-sm text-gray-500 hover:text-gray-700 underline">
                    Admin Dashboard
                </a>
            </div>
        </div>
    </div>

    <div id="message-box" class="message-box"></div>

    <script>
        const form = document.getElementById('intake-form');
        const messageBox = document.getElementById('message-box');
        const submitBtn = document.getElementById('submit-btn');

        function showMessage(message, type = 'success', duration = 5000) {
            messageBox.textContent = message;
            messageBox.className = `message-box ${type}`;
            void messageBox.offsetWidth;
            messageBox.classList.add('show');

            setTimeout(() => {
                messageBox.classList.remove('show');
            }, duration);
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            // Gather form data
            const formData = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                website: document.getElementById('website').value.trim(),
                twitter: document.getElementById('twitter').value.trim(),
                linkedin: document.getElementById('linkedin').value.trim(),
                instagram: document.getElementById('instagram').value.trim(),
                expertise: document.getElementById('expertise').value.trim(),
                topics: document.getElementById('topics').value.trim(),
                bio: document.getElementById('bio').value.trim(),
                previous_appearances: document.getElementById('previous_appearances').value.trim(),
                availability: document.getElementById('availability').value.trim(),
                preferred_format: document.getElementById('preferred_format').value,
                additional_notes: document.getElementById('additional_notes').value.trim(),
                heard_about: document.getElementById('heard_about').value.trim()
            };

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('Thank you! Your application has been submitted successfully.', 'success');
                    form.reset();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    showMessage('Error: ' + (result.error || 'Something went wrong'), 'error');
                }
            } catch (error) {
                showMessage('Error: Unable to submit form. Please try again.', 'error');
                console.error('Submission error:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Application';
            }
        });
    </script>
</body>
</html>
